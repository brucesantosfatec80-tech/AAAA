<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz – Regimes Aduaneiros Especiais</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#5a6578;--pr:#3b4fd8;--ok:#1a8f4c;--okb:#e3f6ea;--no:#c62f3b;--nob:#fde8ea;--bd:#d8deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2030;--tx:#e8ecf6;--mu:#9aa6bd;--pr:#8c9bff;--ok:#4cd187;--okb:#143324;--no:#ff7a85;--nob:#3a1a1f;--bd:#2c3550}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:860px;margin:0 auto;padding:18px}
h1{font-size:1.7rem;margin:.2em 0}.sub{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin:14px 0}
.hero{font-size:3rem;letter-spacing:.2em}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem;margin:4px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600}
.btn.alt{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 12px;font-size:.85rem}
.ico{font-size:2.6rem;line-height:1}
.sc{display:flex;gap:8px;flex-wrap:wrap}.sc .chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.q{font-size:1.2rem;font-weight:600;margin:10px 0 14px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:13px 15px;margin:9px 0}
.o:hover:not(:disabled){border-color:var(--pr)}
.o b{color:var(--pr);margin-right:8px}
.o.c{background:var(--okb);border-color:var(--ok)}.o.x{background:var(--nob);border-color:var(--no)}
.o small{display:block;margin-top:6px;color:var(--mu);font-size:.9rem}
.ex{background:var(--bg);border-left:5px solid var(--pr);border-radius:8px;padding:12px 15px;margin:12px 0}
.rk{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.tp{display:flex;justify-content:space-between;gap:8px;padding:6px 0}.tp .bar{flex:1;margin:10px 8px}
.hid{display:none}
</style></head><body><div class="w">
<div id="app"></div></div>
<script>
// Formato: [ícone, tema, pergunta, correta, [erradas], explicação]; cada alternativa = "texto|comentário"
const Q=[
["🛢️","REPETRO","O REPETRO se parece com a admissão temporária para utilização econômica. Qual é a diferença central apontada nas aulas?","Suspensão TOTAL dos tributos, sem recolhimento proporcional ao tempo de permanência.|Correto: é isso que torna o regime estratégico para o offshore.",["Mantém o pagamento proporcional dos tributos federais conforme o tempo de permanência do bem no país.|Essa é a regra geral da admissão temporária, justamente a que o REPETRO afasta.","Concede isenção definitiva e imediata de todos os tributos, sem qualquer obrigação posterior de destinação.|É suspensão, e o bem precisa ter destinação regular ao fim do regime.","Suspende apenas o Imposto de Importação, devendo IPI, PIS e COFINS-Importação ser pagos normalmente.|A desoneração alcança os tributos federais incidentes, não só o II."],"Base: IN/RFB 844/2008, conforme a aula. Pergunta clássica: “o REPETRO é suspensão total”."],
["🛢️","REPETRO","Sobre o arrendamento mercantil (leasing financeiro) no REPETRO, é correto afirmar:","Não é admitido no regime.|Correto, é uma observação expressa da aula.",["É admitido sempre, desde que a arrendadora seja estrangeira e o bem seja de grande porte.|Não há essa exceção: o leasing financeiro não é admitido.","É admitido apenas para plataformas do pré-sal, como a P-34 e a P-36.|Os exemplos de plataformas ilustram o regime, não criam exceção ao leasing.","É admitido se o bem permanecer na zona econômica exclusiva por menos de um ano.|Prazo de permanência não altera a vedação ao leasing financeiro."],"Atenção: afretamento por tempo (habilitação) é diferente de leasing financeiro."],
["🛢️","REPETRO","Uma indústria brasileira fabrica uma válvula, vende a uma empresa sediada no exterior, e a peça nem sai do país: entra em admissão temporária sob o REPETRO e é operada pela Petrobras. Essa operação é chamada de:","Exportação ficta, tratamento de exportação sem saída do território aduaneiro.|Correto: art. do REPETRO, incisos I e II.",["Reexportação, pois o bem foi desnacionalizado e depois reintroduzido no regime.|Reexportação é o retorno ao exterior de bem que havia sido importado.","Trânsito aduaneiro, pois o bem circula sob controle sem pagar tributos.|Trânsito é o transporte de mercadoria entre pontos do território sob controle, outro regime.","Exportação temporária, pois o bem sairá e retornará ao país em prazo certo.|Na exportação temporária o bem sai fisicamente; aqui ele não sai."],"Inciso I: bem novo nacional vendido a pessoa no exterior. Inciso II: partes e peças de reposição já admitidos."],
["🛢️","REPETRO","Ao fim do prazo do regime, o beneficiário do REPETRO pode adotar qual providência?","Reexportar, despachar para consumo, transferir para outro regime especial, entregar à Fazenda Nacional ou destruir sob controle aduaneiro.|Correto: são as formas de extinção da aplicação do regime.",["Apenas reexportar, pois não há outra forma legal de extinguir o regime.|Há várias hipóteses previstas, entre elas o despacho para consumo.","Deixar o equipamento no país sem providência, se a empresa encerrar as operações petrolíferas.|O encerramento não autoriza deixar o bem sem regularização.","Aguardar a pena de perdimento automática, que extingue o regime sem custo.|Perdimento é sanção, não forma regular de extinção."],"Pegadinha: encerrar atividades no Brasil não dispensa a destinação do bem."],
["🛢️","REPEX","Qual é a definição do REPEX?","Importação de petróleo bruto e derivados com suspensão de tributos federais, para posterior exportação no mesmo estado em que foram importados.|Correto, e é por isso que REPEX ≠ REPETRO.",["Importação de equipamentos usados na pesquisa e lavra de petróleo e gás natural.|Esse é o REPETRO, que trata de bens e não do produto petróleo.","Importação de petróleo para refino no Brasil e exportação dos derivados produzidos.|O REPEX exige exportação no mesmo estado, sem transformação.","Admissão de petróleo estrangeiro com isenção definitiva para abastecer o mercado interno.|A suspensão depende do compromisso de exportação."],"Prazo do REPEX: 90 dias + 90 de prorrogação, contados do desembaraço de admissão."],
["🛢️","REPEX","Qual é o prazo de vigência do REPEX e como é contado?","90 dias, prorrogáveis por mais 90, contados da data do desembaraço aduaneiro de admissão.|Correto.",["1 ano, prorrogável por igual período, contado do registro da declaração de importação.|Esse é o prazo do drawback, não do REPEX.","5 anos improrrogáveis, contados da chegada do navio ao porto.|Não existe esse prazo no REPEX.","180 dias corridos sem prorrogação, contados da emissão da licença da ANP.|O prazo é 90 + 90, mas contado do desembaraço."],"Dica: guarde “REPEX = 90 + 90”, “DRAWBACK = 1 + 1”."],
["🛢️","REPEX","Faltou diesel no interior de SP. A distribuidora tem 10.000 L importados sob REPEX. Como pode usar esse lote no mercado interno?","Abastecendo agora o mercado, desde que no prazo do regime exporte 10.000 L de produto nacional em substituição.|Correto: é a “troca de equivalentes”.",["Vendendo no mercado interno livremente, pois o REPEX dispensa qualquer contrapartida de exportação.|A contrapartida de exportar produto nacional é indispensável.","É proibido: produto admitido no REPEX só pode ser exportado, nunca consumido internamente.|A lei permite o abastecimento interno com a substituição.","Vendendo no mercado interno somente depois de encerrado o regime, sem exportar nada.|A permissão vale dentro do prazo de vigência, com exportação substitutiva."],"Nacionalização “comum” exigiria pagar tributos na hora; o REPEX evita isso pela substituição."],
["⚓","REPORTO","Qual conjunto descreve corretamente os requisitos do REPORTO?","Bens sem similar nacional, importados diretamente pelo beneficiário, para o ativo imobilizado e uso exclusivo em portos (e transporte ferroviário de carga).|Correto.",["Qualquer bem, mesmo com similar nacional, desde que destinado à revenda a operadores portuários.|Há exigência de inexistência de similar nacional e de ativo imobilizado.","Bens importados por conta e ordem de terceiros para uso em qualquer modal, inclusive metrô de passageiros.|O metrô de passageiros não está contemplado.","Bens sem similar nacional, mas obrigatoriamente exportados após 5 anos de uso.|No REPORTO não há compromisso de exportar."],"Observação da aula: inclui bens para serviços de transporte de mercadorias em ferrovias."],
["⚓","REPORTO","Um guindaste portuário foi importado por US$ 100.000 sob REPORTO. Qual peça de reposição, posteriormente, poderá ser enquadrada?","Peça de US$ 30.000, vinculada à declaração original, pois supera 20% do valor aduaneiro.|Correto: valor mínimo de 20% da máquina.",["Peça de US$ 15.000, pois o limite mínimo é de 10% do valor aduaneiro da máquina.|O mínimo é 20%, não 10%.","Peça de US$ 5.000, pois peças de reposição não têm valor mínimo no regime.|Existe valor mínimo: 20% do valor aduaneiro.","Qualquer peça, desde que a máquina original tenha sido importada há menos de 3 anos.|O critério é o valor, não a idade da máquina."],"Cálculo: 30.000 ÷ 100.000 = 30% ≥ 20%. Verifica-se o valor aduaneiro da DI original."],
["⚓","REPORTO","Um operador portuário quer vender, 2 anos depois, o guindaste importado sob REPORTO. O que ocorre?","Exige autorização da RFB e recolhimento dos tributos suspensos, com juros e multa de mora, pois a transferência ocorreu dentro de 5 anos.|Correto: a finalidade do incentivo foi desvirtuada.",["Pode vender livremente, pois o regime não tem compromisso de exportar.|A ausência de compromisso de exportar não libera a transferência.","Basta comunicar à autoridade portuária, sem pagamento de tributos.|A autorização é da RFB e há cobrança dos tributos suspensos.","Deve recolher apenas o II, sem juros nem multa de mora.|Cobram-se todos os tributos suspensos, com juros e multa."],"Atenção: a aula traz “3 anos” num exemplo, mas a regra de transferência cita 5 anos. Confirme com o professor qual prevalece na prova."],
["⚓","REPORTO","Após 5 anos do fato gerador, como ficam os tributos suspensos no REPORTO?","II e IPI convertem-se em isenção; PIS/COFINS-Importação convertem-se em alíquota zero.|Correto.",["Todos os tributos convertem-se em isenção.|PIS/COFINS-Importação viram alíquota zero.","II e IPI viram alíquota zero; PIS/COFINS-Importação viram isenção.|A conversão está invertida.","Todos os tributos são cobrados, pois a suspensão não se converte.|Decorrido o prazo, a suspensão se converte."],"Compare com a ZPE: lá PIS, COFINS e IPI viram alíquota zero, e II e AFRMM viram isenção."],
["⚓","REPORTO","O “tatuzão” do metrô de São Paulo pode ser importado sob REPORTO?","Não: o REPORTO alcança setores portuário e ferroviário de carga; o metrô urbano é tratado por outros regimes, como o REIDI.|Correto.",["Sim, pois o metrô circula sobre trilhos e a lei equipara toda ferrovia.|Não há extensão automática a ferrovias urbanas de passageiros.","Sim, desde que o equipamento não tenha similar nacional.|A ausência de similar não amplia os beneficiários.","Não, mas o REIDI concede isenção definitiva do II e do IPI ao equipamento.|O REIDI suspende PIS e COFINS, não II e IPI."],"Beneficiários: operador portuário, concessionário de porto, arrendatário, dragagem, recintos alfandegados de zona secundária, centros de treinamento e concessionários ferroviários de carga."],
["🚗","RECOM","O RECOM aplica-se a qual operação?","Importação, sem cobertura cambial, de chassis, carroçarias, peças e partes das posições 8701 a 8705, por conta e ordem de encomendante domiciliada no exterior.|Correto.",["Importação por conta própria de máquinas agrícolas das posições 8429 a 8433.|Posição e modalidade incorretas.","Importação de veículos completos para venda direta a consumidores no mercado interno.|O regime visa industrialização por encomenda.","Importação de bens de capital para plataformas, com exportação ficta.|Esse é o REPETRO."],"Exemplo da aula: VW da Alemanha encomenda Gols à VW-Brasil."],
["🚗","RECOM","Produto resultante do RECOM destinado ao mercado interno deve ser remetido a quem?","Empresa comercial atacadista controlada, direta ou indiretamente, pela encomendante no exterior, com suspensão de IPI e PIS/COFINS-Importação.|Correto.",["Qualquer varejista, que pagará os tributos na compra.|Há destinatário específico obrigatório.","Diretamente ao consumidor final, com isenção de IPI.|Não é permitido.","À Fazenda Nacional, que o leiloará.|Não há essa destinação."],"Quando destinado ao exterior, “resolve-se a suspensão” e pede-se restituição do II."],
["🛍️","LOJA FRANCA","Qual afirmação sobre a Loja Franca é correta?","Mercadoria estrangeira entra em consignação com suspensão de tributos, que se converte em isenção na venda; se não vendida, deve ser devolvida.|Correto.",["Mercadoria estrangeira entra com isenção imediata e pode ficar no estoque indefinidamente.|A isenção só ocorre na venda.","Produtos nacionais também entram em consignação, com suspensão de tributos.|Produtos nacionais saem do estabelecimento industrial com isenção, sem consignação.","Só pode ser instalada em aeroportos, nunca em portos ou fronteiras terrestres.|Também em portos e cidades gêmeas de fronteira terrestre."],"Lei 12.723/2012 criou o art. 15-A, que autoriza lojas francas em cidades gêmeas."],
["🛍️","LOJA FRANCA","Passageiro chega por avião com tablet de US$ 1.500 na bagagem acompanhada. Cota de US$ 1.000. Qual é o imposto devido, com RTE de 50% sobre o excesso?","US$ 250, pois o excedente é US$ 500 e o II é 50% desse valor.|Correto: 1.500 − 1.000 = 500; 50% = 250.",["US$ 750, pois o II de 50% incide sobre o valor total do tablet.|A cota é abatida antes: só o excedente é tributado.","US$ 500, pois o imposto é igual ao valor excedente.|O imposto é 50% do excedente, não 100%.","Nada, pois ele pode somar a cota de bagagem com a cota do free shop.|As cotas são individuais e distintas."],"Se não declarar e for selecionado, há multa de 50% sobre o imposto devido, além do imposto."],
["🛍️","LOJA FRANCA","Qual é a cota de isenção para compras em Loja Franca de desembarque por via terrestre?","US$ 500; já por via aérea ou marítima é US$ 1.000.|Correto, conforme a Portaria ME 15.224/2021 citada na aula.",["US$ 1.000 para qualquer modal.|Esse é o valor da bagagem acompanhada, não do free shop terrestre.","US$ 300 para qualquer modal.|Valor incorreto.","Não há limite, desde que o pagamento seja em moeda estrangeira.|Há cota."],"Pegadinha: não se acumula a cota de bagagem com a do free shop, e há prazo de carência de 1 mês."],
["🌴","ZFM","Quais mercadorias são excetuadas da isenção de II e IPI na Zona Franca de Manaus?","Armas e munições, fumo, bebidas alcoólicas, automóveis de passageiros e perfumaria/cosméticos.|Correto.",["Máquinas e equipamentos para instalação industrial.|Ao contrário: são beneficiadas.","Matérias-primas, produtos intermediários e materiais de embalagem para industrialização.|Estas têm isenção de II/IPI e suspensão de PIS/COFINS-Importação.","Medicamentos e produtos alimentares.|Estão na lista positiva da Amazônia Ocidental."],"A ZFM é administrada pela SUFRAMA. Saída sem autorização legal é contrabando (art. 39)."],
["🌴","ZFM","Até quando está mantida a Zona Franca de Manaus, considerando ADCT, EC 42/2003 e EC 83/2014?","Até 2073.|Correto: 1988 + 25 = 2013; + 10 = 2023; + 50 = 2073.",["Até 2013, pois o ADCT previu 25 anos.|Foi prorrogada.","Até 2023, pela EC 42/2003.|A EC 83/2014 acrescentou mais 50 anos.","Até 2063.|Conta incorreta."],"Pegadinha das bolhas do slide: o ADCT originalmente fixou 25 anos, e não 15."],
["🌴","AMAZÔNIA OCIDENTAL","Quais estados compõem a Amazônia Ocidental (R.A.R.A.)?","Amazonas, Rondônia, Acre e Roraima.|Correto.",["Amazonas, Pará, Acre e Roraima.|Pará não integra.","Toda a Região Norte do país.|Amapá, Pará e Tocantins não integram.","Amazonas, Rondônia, Acre, Roraima e Maranhão.|Maranhão não integra."],"Os benefícios da ZFM estendem-se a áreas pioneiras, zonas de fronteira e outras localidades da Amazônia Ocidental, para produtos estrangeiros da lista positiva."],
["🌴","ALC","Como são tratadas, para efeitos fiscais, as vendas para Boa Vista e Bonfim (RR)?","Equiparam-se à exportação.|Correto.",["Equiparam-se a operações internas comuns, com tributação plena.|Há equiparação à exportação.","Equiparam-se à admissão temporária.|Não é esse o tratamento.","São consideradas contrabando se não houver LI.|Não é essa a regra."],"As ALCs também são administradas pela SUFRAMA. Exceção do art. 526: bens finais de informática em Tabatinga e Guajará-Mirim."],
["🏭","ZPE","No que se refere ao tratamento tributário da ZPE, após cumprido o compromisso exportador:","PIS/COFINS-Importação e IPI viram alíquota zero (para não gerar crédito); II e AFRMM viram isenção.|Correto.",["Todos viram isenção, gerando direito a crédito.|A alíquota zero é usada justamente para não gerar crédito.","II e AFRMM viram alíquota zero; os demais viram isenção.|Inversão.","Nenhum se converte, pois a suspensão é permanente.|Há conversão."],"A ZPE é zona primária para controle aduaneiro."],
["🏭","ZPE","Qual foi a mudança trazida pela Lei 14.184/2021 para as ZPEs?","Revogou a exigência de 80% da receita bruta proveniente de exportação, mas a venda interna não é automaticamente isenta.|Correto.",["Manteve os 80% de exportação como regra obrigatória e criou 100% para empresas de TI.|O requisito foi revogado.","Proibiu totalmente as vendas no mercado interno.|A venda interna foi permitida.","Permitiu venda interna com isenção automática de todos os tributos.|Os tributos suspensos e os da venda devem ser recolhidos."],"Antes da lei, vender no mercado interno dependia de autorização do CZPE e pagamento de II e AFRMM com juros e multa."],
["🔁","DRAWBACK","Qual é a natureza jurídica do drawback segundo a aula?","Incentivo à exportação, e não benefício fiscal, dispensando exame de similaridade e transporte em navio de bandeira brasileira.|Correto.",["Benefício fiscal, exigindo exame de similaridade nacional.|Não é benefício fiscal.","Regime comum de importação, sem compromisso de exportar.|Há compromisso de exportar.","Não é considerado incentivo à exportação.|Pegadinha: é incentivo à exportação."],"Despacho para CONSUMO com ato concessório na DI."],
["🔁","DRAWBACK","Quem concede o drawback em cada modalidade?","Suspensão e isenção pela SECEX; restituição pela RFB.|Correto.",["Todas as modalidades pela RFB.|Suspensão e isenção são da SECEX.","Suspensão pela RFB e isenção pela SECEX.|Ambas são da SECEX.","Restituição pela SECEX e as demais pela ANP.|A ANP não concede drawback."],"Pegadinha do slide: a bolha diz que a suspensão é da RFB, o que é falso."],
["🔁","DRAWBACK","Qual é o prazo de vigência do drawback?","1 ano, com uma única prorrogação por igual período; até 5 anos para bens de capital de longo ciclo.|Correto.",["90 dias, prorrogáveis por mais 90.|Esse é o REPEX.","2 anos, prorrogáveis indefinidamente.|Só uma prorrogação.","3 anos improrrogáveis, para todos os bens.|Valor incorreto."],"Inadimplido o compromisso, há 30 dias após o prazo para devolver ao exterior, destruir, consumir com tributos ou entregar à Fazenda."],
["🔁","DRAWBACK","Drawback isenção: empresa importou 1.000 parafusos de aço inox, pagou os tributos e exportou o carro. Na reposição, quer importar 1.000 parafusos de titânio colorido. A isenção cabe?","Não: a mercadoria equivalente deve ter mesma espécie, qualidade e quantidade.|Correto.",["Sim, pois basta ser da mesma quantidade.|Também exige mesma espécie e qualidade.","Sim, pois titânio é de qualidade superior.|Superior não é equivalente.","Sim, mas o ICMS também fica isento.|No drawback isenção o ICMS não é desonerado."],"Drawback suspensão: ICMS isento (Convênio 27/90). Drawback isenção: II isento, IPI/PIS/COFINS alíquota zero, ICMS não desonerado."],
["🔁","DRAWBACK","O que é a fungibilidade (Decreto 8.010/2013)?","Possibilidade de comprovar a exportação com mercadorias equivalentes, adquiridas sem suspensão, em substituição às importadas com suspensão.|Correto.",["Possibilidade de trocar a mercadoria importada por dinheiro.|Não é isso.","Possibilidade de revender o insumo no mercado interno sem tributos.|Isso seria descumprimento.","Dispensa de exportar o produto final.|A exportação continua obrigatória."],"Aplica-se à suspensão e à isenção, condicionada a ato normativo conjunto RFB/SECEX."]
];
const $=s=>document.querySelector(s),app=$("#app");
let T=[],S=[],i=0,order=[],opts=[],done=false,stats={};
const L="ABCD";
function shuf(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function home(){app.innerHTML=`<div class="card"><div class="hero">📚⚓🛢️🏭</div><h1>Quiz de Regimes Aduaneiros Especiais</h1>
<p class="sub">REPETRO, REPEX, REPORTO, RECOM, Loja Franca, ZFM, Amazônia Ocidental, ALC, ZPE e Drawback. Sem cronômetro: leia, discuta com o grupo e só então responda. Cada resposta traz gabarito comentado.</p>
<p><b>Nomes dos jogadores ou grupos</b> (deixe vazio os que não usar):</p>
${[0,1,2,3].map(n=>`<input id="t${n}" placeholder="Jogador/Grupo ${n+1}" value="${n==0?"Turma":""}">`).join("")}
<p class="sub">${Q.length} perguntas. Com vários grupos, a vez de responder alterna a cada pergunta.</p>
<button class="btn" onclick="start()">Começar</button></div>`}
function start(){if($("#t0")){T=[0,1,2,3].map(n=>$("#t"+n).value.trim()).filter(Boolean);if(!T.length)T=["Jogador"]}S=T.map(()=>({p:0,n:0}));stats={};i=0;order=shuf(Q.map((_,k)=>k));show()}
function show(){done=false;const q=Q[order[i]],tm=i%T.length;
opts=shuf([[q[3],1],...q[4].map(w=>[w,0])]);
app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
<div class="row" style="justify-content:space-between;margin:10px 0"><span class="chip">Pergunta ${i+1} de ${Q.length}</span><div class="sc">${T.map((t,k)=>`<span class="chip ${k==tm?"on":""}">${t}: ${S[k].p}</span>`).join("")}</div></div>
<div class="card"><div class="row"><span class="ico">${q[0]}</span><span class="chip">${q[1]}</span>${T.length>1?`<span class="chip">Vez de: <b>${T[tm]}</b></span>`:""}</div>
<div class="q">${q[2]}</div><div id="ops">${opts.map((o,k)=>`<button class="o" onclick="pick(${k})"><b>${L[k]}</b>${o[0].split("|")[0]}</button>`).join("")}</div>
<div id="fb" class="hid"></div></div>`}
function pick(k){if(done)return;done=true;const q=Q[order[i]],tm=i%T.length,ok=opts[k][1]==1;
S[tm].n++;if(ok)S[tm].p++;const st=stats[q[1]]=stats[q[1]]||{a:0,t:0};st.t++;if(ok)st.a++;
document.querySelectorAll(".o").forEach((b,j)=>{b.disabled=true;const [tx,nt]=opts[j][0].split("|");
if(opts[j][1])b.classList.add("c");else if(j==k)b.classList.add("x");
b.innerHTML=`<b>${L[j]}</b>${tx}<small>${opts[j][1]?"✅ Correta. ":(j==k?"❌ Sua escolha. ":"✖ Incorreta. ")}${nt}</small>`});
const f=$("#fb");f.className="";f.innerHTML=`<div class="ex"><b>${ok?"🎉 Acertou!":"Não foi dessa vez."}</b> ${q[5]}</div>
<button class="btn" onclick="next()">${i+1<Q.length?"Próxima pergunta →":"Ver resultado final"}</button>`}
function next(){i++;i<Q.length?show():end()}
function end(){const r=T.map((t,k)=>({t,...S[k]})).sort((a,b)=>b.p-a.p);
app.innerHTML=`<div class="card"><div class="hero">🏆</div><h1>Resultado final</h1>
${r.map((x,k)=>`<div class="rk"><span>${k+1}º ${x.t}</span><b>${x.p} de ${x.n} acertos (${x.n?Math.round(x.p/x.n*100):0}%)</b></div>`).join("")}
<h3>Desempenho por tema</h3>${Object.entries(stats).map(([t,v])=>{const p=Math.round(v.a/v.t*100);return`<div class="tp"><span>${t}</span><div class="bar"><i style="width:${p}%"></i></div><b>${v.a}/${v.t}</b></div>`}).join("")}
<p class="sub">Temas com desempenho baixo merecem nova leitura dos slides antes da prova.</p>
<div class="row"><button class="btn" onclick="start()">Jogar de novo</button><button class="btn alt" onclick="home()">Mudar jogadores</button></div></div>`}
home();
</script></body></html>
